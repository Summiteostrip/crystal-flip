name: Bug Report
description: Report reproducible product or documentation issue
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never include private keys, seed phrases, tokens, payment information, or customer data."
  - type: input
    id: version
    attributes:
      label: Product version
      placeholder: "3.0.1"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Configure...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11"
    validations:
      required: true
